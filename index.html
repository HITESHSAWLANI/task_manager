<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Task Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <main class="container">
    <div class="task-card">
      <header class="card-header">
        <h1 class="title">Task Tracker</h1>
        <p class="subtitle">Stay organized, stay productive</p>
      </header>

      <div class="input-section">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="taskInput" 
            class="task-input" 
            placeholder="What needs to be done?"
            autocomplete="off"
          >
          <div class="input-focus-line"></div>
        </div>
        <button id="addBtn" class="add-btn">
          <span class="btn-text">Add Task</span>
          <span class="btn-icon">+</span>
        </button>
      </div>

      <div class="tasks-container">
        <div id="tasksList" class="tasks-list"></div>
        
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">📋</div>
          <p class="empty-text">No tasks yet. Add one above!</p>
        </div>
      </div>

      <footer class="card-footer">
        <div class="stat">
          <span class="stat-value" id="totalTasks">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="pendingTasks">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="completedTasks">0</span>
          <span class="stat-label">Completed</span>
        </div>
      </footer>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
